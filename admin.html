<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ผู้ดูแล — เช็คอินประชุม</title>
<style>
  :root { --ink:#14213d; --muted:#5b6478; --line:#dfe3ec; --bg:#f3f5fa; --card:#fff; --brand:#1f4fd8;
          --ok:#0f8a4f; --okbg:#e3f6ec; --bad:#b42318;
          --l1:#fef3c7; --l2:#fde68a; --l3:#fbbf24; --l4:#f59e0b;
          --a1:#fecaca; --a2:#f87171; --a3:#991b1b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Noto Sans Thai","Leelawadee UI","Sukhumvit Set",Tahoma,sans-serif; background:var(--bg); color:var(--ink); line-height:1.5; }
  .wrap { max-width:980px; margin:0 auto; padding:16px; }
  h1 { font-size:1.3rem; margin:6px 0 12px; }
  h2 { font-size:1.1rem; margin:0 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  .hidden { display:none !important; }
  button, select, input, textarea { font:inherit; }
  button { cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:10px; padding:8px 14px; font-weight:600; }
  button.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
  button.danger { color:var(--bad); border-color:#f0c4bf; }
  button.big { font-size:1.25rem; padding:18px 22px; width:100%; border-radius:14px; }
  button.go { background:var(--ok); border-color:var(--ok); color:#fff; }
  button.small { padding:4px 10px; font-size:.88rem; font-weight:500; }
  input, textarea, select { border:1px solid var(--line); border-radius:10px; padding:8px 10px; background:#fff; color:var(--ink); max-width:100%; }
  textarea { width:100%; min-height:120px; }
  label { display:block; font-size:.9rem; color:var(--muted); margin:10px 0 4px; }
  .tabs { display:flex; gap:6px; overflow-x:auto; margin-bottom:14px; }
  .tabs button { white-space:nowrap; border-radius:999px; }
  .tabs button.on { background:var(--ink); border-color:var(--ink); color:#fff; }
  .tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px; }
  .tile { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; text-align:center; }
  .tile b { display:block; font-size:1.7rem; font-variant-numeric:tabular-nums; }
  .tile span { color:var(--muted); font-size:.85rem; }
  .tablewrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:.95rem; }
  th, td { text-align:left; padding:8px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:600; font-size:.85rem; }
  td.num, th.num { text-align:center; font-variant-numeric:tabular-nums; }
  .chip { display:inline-block; min-width:2.2em; text-align:center; border-radius:999px; padding:2px 10px; font-weight:600; font-size:.88rem; background:#eef1f8; }
  .st-ontime { background:var(--okbg); color:#0a5c35; } .st-late { background:var(--l2); color:#7c3a06; }
  .st-absent { background:var(--a1); color:#7a1710; } .st-excused { background:#e0e7ff; color:#273a8a; }
  .l0 { background:#eef1f8; color:var(--muted); } .l1 { background:var(--l1); } .l2 { background:var(--l2); } .l3 { background:var(--l3); } .l4 { background:var(--l4); }
  .a0 { background:#eef1f8; color:var(--muted); } .a1 { background:var(--a1); } .a2 { background:var(--a2); color:#fff; } .a3 { background:var(--a3); color:#fff; }
  .tl-g { background:#0b7a2f; color:#fff; } .tl-y { background:#f5c400; color:#3d2f00; } .tl-r { background:#c62828; color:#fff; } .tl-x { background:#8a8f98; color:#fff; }
  .months { display:grid; grid-template-columns:repeat(auto-fill,minmax(52px,1fr)); gap:4px; }
  .months div { border-radius:6px; text-align:center; padding:3px 0; font-weight:600; font-variant-numeric:tabular-nums; }
  .months small { display:block; font-weight:400; font-size:.7rem; opacity:.9; }
  tr.maxed td:first-child { box-shadow:inset 4px 0 0 var(--a3); font-weight:700; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:.85rem; color:var(--muted); margin-bottom:10px; align-items:center; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:0 14px; }
  .muted { color:var(--muted); font-size:.9rem; }
  .top3 { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .top3 div { background:#fffbeb; border:1px solid #fde68a; border-radius:12px; padding:10px; text-align:center; }
  .top3 b { display:block; }
  pre { white-space:pre-wrap; background:#f6f7fb; border:1px solid var(--line); border-radius:10px; padding:12px; font-family:inherit; font-size:.92rem; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:999px; font-size:.95rem; z-index:9; max-width:90vw; }
  #qr svg { width:260px; height:260px; max-width:100%; }
  dialog { border:1px solid var(--line); border-radius:16px; padding:20px; width:min(640px, 94vw); max-height:92vh; color:var(--ink); }
  dialog::backdrop { background:rgba(20,33,61,.45); }
  dialog h3 { margin:18px 0 8px; font-size:1rem; }
  .counts { display:grid; grid-template-columns:repeat(4,1fr); gap:0 12px; }
  .counts input { width:100%; font-size:1.2rem; font-weight:600; text-align:center; }
  @media (max-width:520px) { .counts { grid-template-columns:repeat(2,1fr); } }
  ol { padding-left:20px; margin:6px 0; } ol li { margin-bottom:4px; }
  code { background:#eef1f8; padding:1px 6px; border-radius:6px; word-break:break-all; }
  @media (max-width:600px) { .tiles { grid-template-columns:repeat(2,1fr); } .top3 { grid-template-columns:1fr; } }
  @media print { body * { visibility:hidden; } #qrcard, #qrcard * { visibility:visible; } #qrcard { position:absolute; left:0; top:0; width:100%; border:0; text-align:center; } #qrcard button { display:none; } #qr svg { width:420px; height:420px; } }
</style>
</head>
<body>
<div class="wrap">
  <section id="login" class="card" style="max-width:380px;margin:12vh auto">
    <h1>ผู้ดูแลระบบเช็คอิน</h1>
    <label for="user">ชื่อผู้ใช้</label>
    <input type="text" id="user" style="width:100%" autocomplete="username" autocapitalize="none">
    <label for="pass">รหัสผ่าน</label>
    <input type="password" id="pass" style="width:100%" autocomplete="current-password">
    <p class="muted hidden" id="setupNote" style="margin-top:10px">ระบบยังไม่มีผู้ดูแล — ตั้งชื่อผู้ใช้ (a-z, 0-9) และรหัสผ่าน (อย่างน้อย 8 ตัว) ของผู้ดูแลหลักคนแรก</p>
    <div class="row" style="margin-top:12px"><button class="primary" id="loginBtn">เข้าสู่ระบบ</button><span class="muted" id="loginMsg"></span></div>
    <p style="margin:14px 0 0"><a href="guide.html" target="_blank" rel="noopener" style="color:var(--brand)">📖 คู่มือการใช้งาน</a></p>
  </section>

  <div id="app" class="hidden">
    <div class="row" style="justify-content:space-between"><h1 id="title">เช็คอินประชุม</h1><span class="row"><a href="guide.html" target="_blank" rel="noopener" style="font-weight:600;color:var(--brand)">📖 คู่มือการใช้งาน</a><button class="small" id="logoutBtn">ออกจากระบบ</button></span></div>
    <div class="tabs" id="tabs">
      <button data-tab="today" class="on">วันนี้</button>
      <button data-tab="stats">สรุปสะสม</button>
      <button data-tab="history">ประวัติ</button>
      <button data-tab="members">สมาชิก</button>
      <button data-tab="settings">ตั้งค่า / QR / LINE</button>
    </div>

    <div id="tab-today"></div>
    <div id="tab-stats" class="hidden"></div>
    <div id="tab-history" class="hidden"></div>
    <div id="tab-members" class="hidden"></div>
    <div id="tab-settings" class="hidden"></div>
  </div>
</div>
<dialog id="dlg"></dialog>
<div id="toast" class="hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="config.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var TZ = "Asia/Bangkok", pass = null, D = null, A = null, W = null, needSetup = false, viewId = null, tab = "today", settingsDirty = false;
  var ST = { ontime: "ตรงเวลา", late: "สาย", absent: "ขาด", excused: "ลา" };

  function h(tag, attrs, kids) {
    var e = document.createElement(tag);
    for (var k in (attrs || {})) {
      if (k === "class") e.className = attrs[k];
      else if (k.slice(0, 2) === "on") e[k] = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) e.setAttribute(k, attrs[k]);
    }
    [].concat(kids || []).forEach(function (c) { if (c !== null && c !== undefined && c !== false) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function hhmm(iso) { return iso ? new Date(iso).toLocaleTimeString("th-TH", { timeZone: TZ, hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }) : "-"; }
  // สีตามเกณฑ์ BNI Traffic Lights: เขียว 70+, เหลือง 50-69, แดง 30-49, เทา ต่ำกว่า 30
  function tl(s) { return s >= 70 ? "tl-g" : s >= 50 ? "tl-y" : s >= 30 ? "tl-r" : "tl-x"; }
  function scoreChip(x) { return x.synced_at || +x.score ? h("span", { class: "chip " + tl(+x.score), text: (+x.score).toFixed(2) }) : h("span", { class: "muted", text: "-" }); }
  // แปลงตารางที่คัดลอกจากหน้า Traffic Lights Evolution (วางเป็นข้อความคั่นด้วยแท็บ)
  function parseBni(text) {
    var lines = text.split(/\r?\n/).map(function (l) { return l.split("\t").map(function (c) { return c.trim(); }); });
    var hi = -1; lines.forEach(function (c, i) { if (hi < 0 && c.some(function (x) { return /^\d\d\/\d\d$/.test(x); })) hi = i; });
    if (hi < 0) return null;
    var hd = lines[hi].filter(function (c, i) { return i > 0 || !/^member$/i.test(c); }); if (/^member$/i.test(hd[0])) hd.shift();
    var out = [];
    lines.slice(hi + 1).forEach(function (c) {
      if (c.length < hd.length + 1 || !/[A-Za-zก-๙]/.test(c[0])) return;
      var cells = c.slice(c.length - hd.length), row = { name: c[0].replace(/\s*\(.*\)\s*$/, ""), months: {} };
      hd.forEach(function (k, i) {
        var m = k.match(/^(\d\d)\/(\d\d)$/), v = cells[i];
        if (m) { if (v !== "") row.months["20" + m[2] + "-" + m[1]] = +v; }
        else if (/^avg/i.test(k)) row.avg = v; else if (/^visi/i.test(k)) row.visitors = v; else if (/^vis\/w/i.test(k)) row.vis_week = v; else if (/^spons/i.test(k)) row.sponsored = v;
      });
      out.push(row);
    });
    return out;
  }
  var toastT;
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.classList.remove("hidden"); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.add("hidden"); }, 3500); }
  async function call(fn, args, okMsg) {
    try {
      var r = await mcRpc(fn, Object.assign({ p_pass: pass }, args || {}));
      if (okMsg) toast(okMsg);
      return r;
    } catch (e) {
      if (e.message === "bad_password") { logout("รหัสผ่านไม่ถูกต้อง"); } else toast("ผิดพลาด: " + e.message);
      return null;
    }
  }
  async function act(fn, args, okMsg) { var r = await call(fn, args, okMsg); if (r) await load(); return r; }
  async function load() {
    var r = await call("admin_dashboard", { p_meeting_id: viewId });
    if (!r) return false;
    if (!W || tab === "settings") { var w = await call("admin_warnings"); if (w) W = w; }
    D = r; $("title").textContent = D.settings.org_name; render(); return true;
  }
  function logout(msg) {
    if (pass) mcRpc("admin_logout", { p_pass: pass }).catch(function () {});
    pass = null; A = null; W = null; sessionStorage.removeItem("mc_token"); if ($("dlg").open) $("dlg").close();
    $("app").classList.add("hidden"); $("login").classList.remove("hidden"); $("loginMsg").textContent = msg === "รหัสผ่านไม่ถูกต้อง" ? "หมดเวลาเข้าสู่ระบบ กรุณาเข้าใหม่" : (msg || "");
  }
  // pass = โทเคนเข้าสู่ระบบ (อายุ 12 ชั่วโมง) ไม่ได้เก็บรหัสผ่านจริงไว้ในเครื่อง
  async function enter(token) {
    pass = token;
    try { D = await mcRpc("admin_dashboard", { p_pass: pass, p_meeting_id: null }); A = await mcRpc("admin_list_admins", { p_pass: pass }); W = await mcRpc("admin_warnings", { p_pass: pass }); }
    catch (e) { pass = null; sessionStorage.removeItem("mc_token"); $("loginMsg").textContent = e.message === "bad_password" ? "กรุณาเข้าสู่ระบบ" : e.message; return; }
    sessionStorage.setItem("mc_token", pass);
    $("login").classList.add("hidden"); $("app").classList.remove("hidden"); $("loginMsg").textContent = ""; $("pass").value = "";
    $("title").textContent = D.settings.org_name; render();
  }
  async function login() {
    $("loginMsg").textContent = "กำลังตรวจสอบ…";
    try {
      if (needSetup) { await mcRpc("admin_setup", { p_user: $("user").value, p_password: $("pass").value }); needSetup = false; $("setupNote").classList.add("hidden"); $("loginBtn").textContent = "เข้าสู่ระบบ"; }
      var r = await mcRpc("admin_login", { p_user: $("user").value, p_password: $("pass").value }); await enter(r.token);
    }
    catch (e) { $("loginMsg").textContent = e.message === "bad_password" ? "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง" : e.message; }
  }
  async function loadAdmins() { var r = await call("admin_list_admins"); if (r) { A = r; settingsDirty = false; renderSettings(); } }

  // ---------- หน้าต่างแก้ข้อมูลรายคน
  async function openMember(id) {
    var r = await call("admin_member_detail", { p_member_id: id }); if (!r || !r.member) return;
    var m = r.member, s = D.settings, dlg = $("dlg"); dlg.textContent = "";
    function num(idn, label, val, step) { return h("div", {}, [h("label", { for: idn, text: label }), h("input", { id: idn, type: "number", min: step ? null : 0, step: step || 1, value: val })]); }
    var name = h("input", { id: "m_name", value: m.name, style: "width:100%" });
    var active = h("input", { id: "m_active", type: "checkbox" }); active.checked = m.active;
    var note = h("input", { id: "m_note", value: m.note || "", style: "width:100%", placeholder: "เช่น ยอดยกมาจากสมุดเซ็นชื่อ" });
    dlg.appendChild(h("div", {}, [
      h("div", { class: "row", style: "justify-content:space-between" }, [h("h2", { text: "แก้ข้อมูลสมาชิก", style: "margin:0" }), h("button", { class: "small", text: "ปิด", onclick: function () { dlg.close(); } })]),
      h("label", { for: "m_name", text: "ชื่อ" }), name,
      h("h3", { text: "ยอดสะสม (แก้ตัวเลขได้โดยตรง)" }),
      h("div", { class: "counts" }, [num("m_late", "มาสาย (ครั้ง)", m.late), num("m_absent", "ขาด (ครั้ง)", m.absent), num("m_exc", "ลา (ครั้ง)", m.excused), num("m_score", "คะแนน", m.score, "any")]),
      h("p", { class: "muted", style: "margin:8px 0 0", text: "ตอนนี้: สาย " + m.late + " ครั้ง = ขาด " + m.late_conv + " (เหลือ " + m.late_rem + "/" + s.late_per_absence + ") · ขาดรวม " + m.total_absent + "/" + s.absence_limit + (m.maxed ? " 🚨 ถึงโทษสูงสุด" : "") + " · ช่องคะแนนเตรียมไว้เชื่อมกับเว็บไซต์ภายหลัง" }),
      (m.months && m.months.length) ? h("div", {}, [
        h("h3", { text: "คะแนน BNI Traffic Lights รายเดือน" }),
        h("div", { class: "months" }, m.months.map(function (x) { return h("div", { class: tl(x.s) }, [String(x.s), h("small", { text: x.m })]); })),
        h("p", { class: "muted", style: "margin:8px 0 0", text: "Visitor 12 เดือน: " + (m.visitors === null ? "-" : m.visitors) + " · Sponsor: " + (m.sponsored === null ? "-" : m.sponsored) + " · ช่องคะแนนด้านบน = ค่าเฉลี่ยจาก BNI และจะถูกเขียนทับเมื่อนำเข้ารอบใหม่" })]) : null,
      h("label", { for: "m_note", text: "หมายเหตุ" }), note,
      h("label", { style: "display:flex;gap:8px;align-items:center;color:inherit;font-size:1rem" }, [active, "ยังเป็นสมาชิกอยู่ (ถ้าเอาออก จะไม่ถูกนับขาดอีก แต่ประวัติยังอยู่)"]),
      h("div", { class: "row", style: "margin-top:14px" }, [
        h("button", { class: "primary", text: "บันทึก", onclick: async function () {
          var ok = await call("admin_save_member", { p_member_id: id, p_name: name.value, p_active: active.checked, p_late: +$("m_late").value, p_absent: +$("m_absent").value, p_excused: +$("m_exc").value, p_score: +$("m_score").value, p_note: note.value }, "บันทึกแล้ว");
          if (ok) { dlg.close(); load(); }
        } }),
        m.bound ? h("button", { text: "รีเซ็ตมือถือ", onclick: async function () { if (confirm("รีเซ็ตการผูกมือถือของ " + m.name + "?\nเขาจะต้องเลือกชื่อใหม่ในการสแกนครั้งถัดไป")) { if (await call("admin_reset_device", { p_member_id: id }, "รีเซ็ตแล้ว")) { load(); openMember(id); } } } }) : h("span", { class: "muted", text: "ยังไม่ได้ผูกมือถือ" })]),
      h("h3", { text: "ประวัติรายครั้ง (" + r.history.length + ")" }),
      r.history.length ? h("div", { class: "tablewrap" }, [h("table", {}, [h("tbody", {}, r.history.map(function (x) {
        var sel = h("select", { "aria-label": "แก้สถานะ" }, Object.keys(ST).map(function (k) { return h("option", { value: k, text: ST[k], selected: k === x.status ? "selected" : null }); }));
        sel.onchange = async function () { if (await call("admin_set_attendance", { p_meeting_id: x.meeting_id, p_member_id: id, p_status: sel.value }, "บันทึกแล้ว")) { load(); openMember(id); } };
        return h("tr", {}, [h("td", { text: x.date_text }), h("td", { text: x.checked_at ? hhmm(x.checked_at).slice(0, 5) + " น." : "-" }), h("td", {}, [sel])]);
      }))])]) : h("p", { class: "muted", text: "ยังไม่มีประวัติการประชุม" })
    ]));
    if (!dlg.open) dlg.showModal();
  }
  async function watchLine(r) {
    if (!r) return;
    if (!r.line_request) { toast("ยังไม่ได้ส่ง LINE — ตั้งค่า LINE ให้ครบก่อน (แท็บตั้งค่า)"); return; }
    for (var i = 0; i < 8; i++) {
      await new Promise(function (ok) { setTimeout(ok, 1500); });
      var s = await call("admin_line_result", { p_request: r.line_request });
      if (s && s.done) { toast(s.status === 200 ? "ส่งเข้า LINE สำเร็จ ✅" : "LINE ตอบกลับผิดพลาด (" + (s.status || s.error) + ") " + (s.body || "")); return; }
    }
    toast("ส่งคำขอไปยัง LINE แล้ว กรุณาตรวจในกลุ่ม");
  }

  // ---------- วันนี้ / รายละเอียดรอบประชุม
  function statusSelect(memberId, current) {
    var sel = h("select", { "aria-label": "แก้สถานะ" }, [h("option", { value: "", text: current ? "แก้ไข…" : "บันทึกเป็น…" })]
